  <!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishing Quiz Adventure</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>Fishing Quiz Adventure</h1>
          <p>Memancing sambil menjawab soal</p>
        </div>
        <button id="adminBtn" class="ghost-btn">Admin</button>
      </header>

      <main>
        <section id="loginScreen" class="panel active">
          <h2>Masuk Permainan</h2>
          <div class="form-grid">
            <label>
              Nama siswa
              <input id="playerName" type="text" maxlength="30" placeholder="Contoh: Rina" required />
            </label>
            <label>
              Kelas
              <input id="playerClass" type="text" maxlength="20" placeholder="Contoh: 8A" required />
            </label>
          </div>
          <button id="startBtn" class="primary-btn">Main</button>
        </section>

        <section id="gameScreen" class="panel hidden">
          <div class="hud">
            <div class="stat-box">
              <span>Nama</span>
              <strong id="hudName">-</strong>
            </div>
            <div class="stat-box">
              <span>Kelas</span>
              <strong id="hudClass">-</strong>
            </div>
            <div class="stat-box">
              <span>Skor</span>
              <strong id="hudScore">0</strong>
            </div>
            <div class="stat-box">
              <span>Umpan</span>
              <strong id="hudBait">15</strong>
            </div>
            <div class="stat-box">
              <span>Target</span>
              <strong id="hudTarget">500</strong>
              <div class="stat-box">
            <span>Waktu</span>
              <strong id="hudTime">03:00</strong>
          </div>
            </div>
          </div>

          <div class="control-row">
            <select id="fishTarget">
              <option value="semua">Semua ikan</option>
              <option value="umum">Ikan umum</option>
              <option value="langka">Ikan langka</option>
              <option value="super">Ikan super</option>
              <option value="epik">Ikan epik</option>
            </select>
            <button id="castBtn" class="primary-btn">Lempar Umpan</button>
          </div>

          <div class="game-wrap">
            <canvas id="gameCanvas" width="900" height="420"></canvas>
            <div id="statusMessage" class="status-message">Siap memancing!</div>
          </div>

          <div class="summary-grid">
            <div class="summary-item">
              <span>Jumlah ikan</span>
              <strong id="fishCaughtCount">0</strong>
            </div>
            <div class="summary-item">
              <span>Progress target</span>
              <strong id="progressText">0%</strong>
            </div>
          </div>
        </section>

        <section id="resultScreen" class="panel hidden">
          <h2>Hasil Permainan</h2>
          <div id="resultSummary" class="result-summary"></div>
          <div id="leaderboardBox" class="leaderboard-box"></div>
          <div id="reviewBox" class="review-box"></div>
          <button id="playAgainBtn" class="primary-btn">Main Lagi</button>
        </section>
      </main>
    </div>

    <div id="adminModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Admin</h3>
          <button id="closeAdminBtn" class="close-btn">✕</button>
        </div>

        <div id="adminLoginPanel" class="admin-section">
          <label>
            Password admin
            <input id="adminPassword" type="password" placeholder="Masukkan password" />
          </label>
          <button id="loginAdminBtn" class="primary-btn">Masuk</button>
        </div>

        <div id="adminPanel" class="admin-section hidden">
          <h4>Kelola soal</h4>
          <textarea id="questionsEditor" rows="14" placeholder="Masukkan format JSON array"></textarea>
          <button id="saveQuestionsBtn" class="primary-btn">Simpan Soal</button>
          <p id="adminStatus" class="admin-status"></p>
        </div>
      </div>
    </div>

    <div id="questionModal" class="modal hidden">
      <div class="modal-content question-content">
        <h3>Ikan tertangkap</h3>
        <p id="questionText"></p>
        <div id="answerOptions" class="answers"></div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
